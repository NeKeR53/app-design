# Vérifie socle-ui sous Windows à chaque push sur main et à chaque pull request : contrôles, lint, types, tests, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: design-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - run: npm ci

      - name: Contrôles, lint, types et tests
        run: npm run check

      - name: Build du package
        run: npm run build
